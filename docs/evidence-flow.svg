<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc"><title id="title">From correspondence to an evidence-based next step</title><desc id="desc">Conceptual diagram. Analyze authorized correspondence by speaker, action, and date. Keep engagement, recruitment, funding, and formal outcome separate. Suggest one next step without converting evidence to admission odds.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#567b9d" stroke-width="1.5"/></marker></defs><rect width="1200" height="480" rx="24" fill="#f0f4f8"/><g font-family="Arial, sans-serif"><text x="44" y="48" fill="#527290" font-size="14" font-weight="700" letter-spacing="3">COLD OUTREACH / EVIDENCE BEFORE INTERPRETATION</text><text x="44" y="100" fill="#233b51" font-size="34" font-weight="700">One reply. Four separate questions.</text><text x="44" y="132" fill="#657b8e" font-size="17">Keep a concrete action distinct from an admission decision.</text><rect x="44" y="177" width="292" height="211" rx="16" fill="#fff" stroke="#cddbe7"/><text x="66" y="212" fill="#527290" font-size="13" font-weight="700">AUTHORIZED MATERIAL</text><text x="66" y="253" fill="#233b51" font-size="23" font-weight="700">Read the evidence</text><text x="66" y="287" fill="#657b8e" font-size="17">Who said it?</text><text x="66" y="315" fill="#657b8e" font-size="17">What did they commit to?</text><text x="66" y="343" fill="#657b8e" font-size="17">When, and for which route?</text><path d="M348 283H385" stroke="#567b9d" stroke-width="2" marker-end="url(#a)"/><g fill="#e1ebf2" stroke="#c4d4e0"><rect x="401" y="177" width="350" height="91" rx="13"/><rect x="401" y="285" width="350" height="103" rx="13"/></g><g fill="#233b51" font-size="21" font-weight="700"><text x="423" y="214">Engagement / Recruitment</text><text x="423" y="322">Funding / Formal outcome</text></g><g fill="#657b8e" font-size="15"><text x="423" y="243">Support observed ≠ confirmed capacity</text><text x="423" y="353">A discussion ≠ documented funding</text></g><path d="M765 283H802" stroke="#567b9d" stroke-width="2" marker-end="url(#a)"/><rect x="818" y="177" width="338" height="211" rx="16" fill="#233b51"/><text x="840" y="212" fill="#9dc7d9" font-size="13" font-weight="700">USEFUL NEXT STEP</text><text x="840" y="253" fill="#fff" font-size="23" font-weight="700">Resolve the missing fact</text><text x="840" y="287" fill="#c3d4e1" font-size="17">Name the uncertainty.</text><text x="840" y="315" fill="#c3d4e1" font-size="17">Check the official process.</text><text x="840" y="343" fill="#c3d4e1" font-size="17">Do not invent admission odds.</text><text x="44" y="432" fill="#527290" font-size="16">Silence = unscorable (U).  An offer = a separate outcome.  A tier ≠ a probability.</text><text x="44" y="461" fill="#8194a4" font-size="12">CONCEPTUAL EVIDENCE FLOW · NO PRIVATE EMAILS OR ADMISSION PREDICTIONS</text></g></svg>